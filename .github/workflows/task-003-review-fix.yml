name: Task 003 review fix

on:
  push:
    branches:
      - task/003-report-builder-renderer

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: task/003-report-builder-renderer

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply review fixes
        run: node scripts/apply-task-003-review-fixes-v2.mjs

      - name: Install exact dependency graph
        run: npm ci

      - name: Run complete checks
        run: npm run check

      - name: Commit final branch-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix: close report metadata and path safety gaps"
          git push origin HEAD:task/003-report-builder-renderer
