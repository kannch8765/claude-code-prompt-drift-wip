name: Task 005 B1 full check

on:
  push:
    branches:
      - validation/task-005-b1-full-check

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIX_SHA: 7df2b47d943a0e04be09c84271e83f36ccfc81e1
      WORKFLOW_PATH: .github/workflows/task-005-b1-one-shot.yml
      VALIDATION_BRANCH: validation/task-005-b1-full-check

    steps:
      - name: Checkout validation commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify fixed source and one-shot-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$FIX_SHA"
          test "$(git diff --name-only "$FIX_SHA" HEAD)" = "$WORKFLOW_PATH"
          git diff --exit-code "$FIX_SHA" HEAD -- . ":(exclude)$WORKFLOW_PATH"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependency graph
        run: npm ci

      - name: Run complete checks and capture closure
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee /tmp/task-005-check.log
          tests="$(sed -n 's/^# tests //p' /tmp/task-005-check.log | tail -n 1)"
          pass="$(sed -n 's/^# pass //p' /tmp/task-005-check.log | tail -n 1)"
          fail="$(sed -n 's/^# fail //p' /tmp/task-005-check.log | tail -n 1)"
          test -n "$tests"
          test -n "$pass"
          test -n "$fail"
          test "$tests" = "$pass"
          test "$fail" = "0"
          printf 'TESTS=%s\nPASS=%s\nFAIL=%s\n' "$tests" "$pass" "$fail" >> "$GITHUB_ENV"

      - name: Remove one-shot trigger after success
        shell: bash
        run: |
          set -euo pipefail
          rm "$WORKFLOW_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > /tmp/task-005-validation-message <<EOF
          ci: validate task 005 b1 full check

          npm ci: PASS
          npm run check: PASS
          tests: ${TESTS}/${PASS}
          fail: ${FAIL}
          source: ${FIX_SHA}
          EOF
          git add "$WORKFLOW_PATH"
          git commit -F /tmp/task-005-validation-message
          git push origin "HEAD:${VALIDATION_BRANCH}"
