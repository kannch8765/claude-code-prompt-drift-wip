name: Task 003 B2.2 fix

on:
  push:
    branches:
      - task/003-report-builder-renderer

permissions:
  contents: write

jobs:
  fix-verify-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: task/003-report-builder-renderer

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply narrow HTTPS boundary fix
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile, writeFile } from "node:fs/promises";

          const rendererPath = "src/render-issue-markdown.mjs";
          let renderer = await readFile(rendererPath, "utf8");
          const oldPattern = String.raw`  /(https:\/\/[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?:\/(?!\.{1,2}(?:\/|$))[A-Za-z0-9._~-]+)*)/giu;`;
          const newPattern = String.raw`  /(https:\/\/[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?:\/(?!\.{1,2}(?:\/|$))[A-Za-z0-9._~-]+)*)(?!:[\\/])/giu;`;
          assert.equal(renderer.includes(oldPattern), true, "expected renderer pattern");
          assert.equal(renderer.indexOf(oldPattern), renderer.lastIndexOf(oldPattern));
          renderer = renderer.replace(oldPattern, newPattern);
          await writeFile(rendererPath, renderer);

          const testPath = "test/report-safety-regressions.test.mjs";
          let tests = await readFile(testPath, "utf8");
          const addition = String.raw`

          test("renderer leaves adjacent drive letters outside canonical HTTPS protection", () => {
            const message = [
              "source=https://airship.example.invalid/publicC:\\private\\prompt.md",
              "source=https://airship.example.invalid/C:\\private\\prompt.md",
            ].join(" ");
            const markdown = renderIssueMarkdown(
              build({ classification: classification(message) }),
            );

            assert.equal(markdown.includes("C:\\private\\prompt.md"), false);
            assert.equal(markdown.includes(":\\private\\prompt.md"), false);
            assert.ok(
              (markdown.match(/&#91;redacted-absolute-path&#93;/gu)?.length ?? 0) >= 2,
            );
            assert.match(markdown, /https:\/\/airship\.example\.invalid\/public/u);
            assert.match(markdown, /https:\/\/airship\.example\.invalid/u);
          });
          `;
          assert.equal(tests.includes("adjacent drive letters outside canonical HTTPS protection"), false);
          tests = `${tests.trimEnd()}${addition}`;
          await writeFile(testPath, tests);
          NODE

      - name: Install exact dependency graph
        run: npm ci

      - name: Run complete checks
        run: npm run check

      - name: Commit verified fix and remove verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/task-003-b22-fix.yml
          git add --all
          git diff --cached --check
          git commit -m "fix: preserve adjacent drive path detection"
          git push origin HEAD:task/003-report-builder-renderer
